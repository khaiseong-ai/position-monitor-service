name: Position Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: Send Telegram alerts during this manual run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: position-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSITION_RELAY_URL: ${{ secrets.POSITION_RELAY_URL }}
      POSITION_RELAY_TOKEN: ${{ secrets.POSITION_RELAY_TOKEN }}
      POSITION_RELAY_EXCHANGES: bybit
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      MEXC_REST_BASE: https://contract.mexc.com
      MEXC_SIZE_MULTIPLIERS: ${{ secrets.MEXC_SIZE_MULTIPLIERS }}
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      BITGET_REST_BASE: https://api.bitget.com
      BITGET_PRODUCT_TYPE: USDT-FUTURES
      BITGET_MARGIN_COIN: USDT
      PHEMEX_API_KEY: ${{ secrets.PHEMEX_API_KEY }}
      PHEMEX_API_SECRET: ${{ secrets.PHEMEX_API_SECRET }}
      PHEMEX_REST_BASE: https://api.phemex.com
      PHEMEX_CURRENCY: USDT
      HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
      HYPERLIQUID_REST_BASE: https://api.hyperliquid.xyz
      HYPERLIQUID_DEXS: xyz
      BACKPACK_API_KEY: ${{ secrets.BACKPACK_API_KEY }}
      BACKPACK_API_SECRET: ${{ secrets.BACKPACK_API_SECRET }}
      BACKPACK_REST_BASE: https://api.backpack.exchange
      BACKPACK_PROXY_URL: ""
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POSITION_SHEET_WEBAPP_URL: ${{ secrets.POSITION_SHEET_WEBAPP_URL }}
      POSITION_SHEET_SECRET: ${{ secrets.POSITION_SHEET_SECRET }}
      POSITION_NOTIFY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify) }}
      TOLERANCE: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check && npm test

      - name: Connect free Cloudflare WARP egress
        run: bash scripts/connect-warp.sh

      - name: Probe official exchange endpoints
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/network-probe.mjs

      - name: Refresh position sheet
        run: npm run monitor:once
