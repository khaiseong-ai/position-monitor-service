name: KS Vercel Funding Sheet

on:
  workflow_dispatch:
    inputs:
      clear_only:
        description: Clear stale Sheet data without querying exchanges
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ks-vercel-funding-sheet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      PHEMEX_API_KEY: ${{ secrets.PHEMEX_API_KEY }}
      PHEMEX_API_SECRET: ${{ secrets.PHEMEX_API_SECRET }}
      BACKPACK_API_KEY: ${{ secrets.BACKPACK_API_KEY }}
      BACKPACK_API_SECRET: ${{ secrets.BACKPACK_API_SECRET }}
      HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
      POSITION_RELAY_URL: https://ks-funding-relay.position-monitor-service.workers.dev
      POSITION_RELAY_TOKEN: ${{ secrets.POSITION_RELAY_TOKEN }}
      POSITION_RELAY_EXCHANGES: binance,bybit
      FUNDING_SHEET_WEBAPP_URL: ${{ secrets.POSITION_SHEET_WEBAPP_URL }}
      FUNDING_SHEET_SECRET: ${{ secrets.POSITION_SHEET_SECRET }}

    steps:
      - name: Clear stale funding Sheet data
        if: ${{ inputs.clear_only == true }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = String(process.env.FUNDING_SHEET_WEBAPP_URL || "").trim();
          const secret = String(process.env.FUNDING_SHEET_SECRET || "").trim();
          if (!endpoint || !secret) throw new Error("funding_sheet_not_configured");
          const snapshot = {
            success: true,
            checkedAt: new Date().toISOString(),
            elapsedMs: 0,
            totalEquity: 0,
            equity: [],
            positions: [],
            hedgeHealth: { noProtection: [], fundingLoss: [], misaligned: [] }
          };
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ action: "writeAccountFunding", secret, snapshot })
          });
          const body = await response.json().catch(() => null);
          if (!response.ok || body?.ok !== true || Number(body?.rowsWritten) !== 0) {
            throw new Error("funding_sheet_clear_failed");
          }
          NODE

      - name: Check out funding source
        if: ${{ inputs.clear_only != true }}
        uses: actions/checkout@v4
        with:
          repository: khaiseong-ai/vercel-binance-funding
          ref: main

      - name: Set up Node.js
        if: ${{ inputs.clear_only != true }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.clear_only != true }}
        run: npm ci

      - name: Validate funding source
        if: ${{ inputs.clear_only != true }}
        run: npm run check && npm test

      - name: Refresh independent funding Sheet
        if: ${{ inputs.clear_only != true }}
        run: npm run snapshot:sheet
