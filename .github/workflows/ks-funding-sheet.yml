name: KS Vercel Funding Sheet

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ks-vercel-funding-sheet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
      BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
      BITGET_API_PASSPHRASE: ${{ secrets.BITGET_API_PASSPHRASE }}
      PHEMEX_API_KEY: ${{ secrets.PHEMEX_API_KEY }}
      PHEMEX_API_SECRET: ${{ secrets.PHEMEX_API_SECRET }}
      BACKPACK_API_KEY: ${{ secrets.BACKPACK_API_KEY }}
      BACKPACK_API_SECRET: ${{ secrets.BACKPACK_API_SECRET }}
      HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
      FUNDING_SHEET_WEBAPP_URL: ${{ secrets.POSITION_SHEET_WEBAPP_URL }}
      FUNDING_SHEET_SECRET: ${{ secrets.POSITION_SHEET_SECRET }}

    steps:
      - name: Check out funding source
        uses: actions/checkout@v4
        with:
          repository: khaiseong-ai/vercel-binance-funding
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate funding source
        run: npm run check && npm test

      - name: Refresh independent funding Sheet
        run: npm run snapshot:sheet
