services:
  - type: web
    name: ks-position-geo-proxy-singapore
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci
    startCommand: npm run relay:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BINANCE_WS_POSITIONS_ONLY
        value: "true"
